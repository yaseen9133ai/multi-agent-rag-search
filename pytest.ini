; Pytest config for the eval suite. (The build is split into per-component pyproject.toml files
; under agent/ and mcp/, so there's no root pyproject to hold [tool.pytest.ini_options]; this
; small file keeps the eval suite's pytest settings at the repo root.)
[pytest]
asyncio_mode = auto
testpaths = eval

; Silence third-party noise from the ADK eval stack (google.adk / mcp / genai):
; [EXPERIMENTAL] feature notices and their deprecation churn. None come from our code, and
; they bury the actual pass/fail summary. Order matters: later rules win, so we re-enable
; warnings from our own eval modules after the broad ignores.
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*\[EXPERIMENTAL\].*:UserWarning
    default::DeprecationWarning:trajectory_metrics
    default::DeprecationWarning:compare_to_baseline
    default::DeprecationWarning:online_eval
